<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minimal Electron Fixture</title>
  </head>
  <body>
    <h1 id="heading">Hello from fixture</h1>
    <p id="status">ready</p>
    <div id="app-root" class="root">
      <input id="name" type="text" placeholder="name" aria-label="name" />
      <button id="go" type="button" aria-label="Go">Go</button>
    </div>
    <div id="scroller" style="height: 80px; overflow: auto; border: 1px solid #ccc">
      <div id="scroll-tall" style="height: 600px">scroll-tall</div>
    </div>
    <div id="drag-source" style="width: 80px; height: 24px">drag-source</div>
    <div id="drag-target" style="width: 120px; height: 24px; margin-top: 40px">drag-target</div>
    <script>
      window.__FIXTURE__ = {
        name: "minimal-electron-app",
        version: 1,
        clicks: 0,
      };
      console.log("fixture-console-ok");
      console.warn("fixture-console-warn");
      fetch("data:application/json,{\"ok\":true}").catch(() => {});

      document.getElementById("go").addEventListener("click", () => {
        window.__FIXTURE__.clicks += 1;
        const name = document.getElementById("name").value || "anonymous";
        document.getElementById("status").textContent = "clicked:" + name;
        console.log("fixture-clicked:" + name);
      });
      document.getElementById("go").addEventListener("mouseover", () => {
        window.__FIXTURE__.hovered = true;
      });
      const source = document.getElementById("drag-source");
      const target = document.getElementById("drag-target");
      let dragging = false;
      source.addEventListener("mousedown", () => {
        dragging = true;
      });
      target.addEventListener("mouseup", () => {
        if (dragging) window.__FIXTURE__.dropped = true;
      });
    </script>
  </body>
</html>
