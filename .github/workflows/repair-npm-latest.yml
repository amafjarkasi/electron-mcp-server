name: Repair npm latest tag

# One-shot: the npmjs.com versions tab showed 1.7.0 as latest while 1.8.0
# is the release. Point latest at 1.8.0 and remove the orphan 1.7.0 version.
on:
  push:
    branches:
      - cursor/fix-latest-tag-196e

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Point latest at 1.8.0 and unpublish 1.7.0
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          echo "whoami:"
          npm whoami
          echo "before:"
          npm view electron-debug-mcp dist-tags versions time --json
          echo "dist-tag add 1.8.0 latest:"
          npm dist-tag add electron-debug-mcp@1.8.0 latest
          echo "dist-tag exit $?"
          echo "tags now:"
          npm dist-tag ls electron-debug-mcp
          echo "unpublish 1.7.0:"
          npm unpublish electron-debug-mcp@1.7.0 --force
          echo "unpublish exit $?"
          echo "after:"
          npm view electron-debug-mcp dist-tags versions time --json
          npm view electron-debug-mcp@1.7.0 version
          echo "view 1.7 exit $?"
