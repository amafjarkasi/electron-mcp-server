name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (must match package.json version, e.g. v1.6.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_MCP_NO_SANDBOX: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # npm stage requires npm 11+/12+ (Node ^22.22 or 24+)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --foreground-scripts

      - name: Ensure Electron binary
        run: npm run ensure-electron

      - name: Typecheck + pack surface
        run: |
          npm run typecheck
          npm run pack:check

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          EXPECTED="v${PKG_VERSION}"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "Tag '$TAG' does not match package.json version '$EXPECTED'"
            exit 1
          fi
          echo "Staging electron-debug-mcp@${PKG_VERSION} (tag ${TAG})"
          echo "PKG_VERSION=${PKG_VERSION}" >> "$GITHUB_ENV"

      - name: Confirm npm auth
        run: |
          npm --version
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Stage-only / no-bypass-2FA tokens: upload for maintainer OTP approve.
      # Approve locally: npm stage list && npm stage approve <id> --otp=<code>
      - name: Stage package for npm publish
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(npm stage publish --access public 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [[ $STATUS -ne 0 ]]; then
            exit $STATUS
          fi
          # Best-effort capture of a stage id from CLI output.
          STAGE_ID="$(printf '%s\n' "$OUTPUT" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tail -1 || true)"
          if [[ -n "$STAGE_ID" ]]; then
            echo "stage_id=$STAGE_ID" >> "$GITHUB_OUTPUT"
            echo "Staged id: $STAGE_ID"
          fi
          echo "Listing pending stages:"
          npm stage list || npm stage list "electron-debug-mcp" || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Approve returns 404 while status is "validating", and a failed
      # validation removes the stage entirely. Wait until it is "staged".
      - name: Wait until stage is approvable
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          STAGE_ID="${{ steps.stage.outputs.stage_id }}"
          if [[ -z "$STAGE_ID" ]]; then
            echo "No stage id was captured from npm stage publish"
            exit 1
          fi
          for i in $(seq 1 36); do
            set +e
            OUTPUT="$(npm stage view "$STAGE_ID" --json 2>&1)"
            VIEW_STATUS=$?
            set -e
            echo "$OUTPUT"
            if [[ $VIEW_STATUS -ne 0 ]]; then
              if printf '%s\n' "$OUTPUT" | grep -Eqi 'not found|404'; then
                echo "Stage $STAGE_ID is gone (validation rejected it or it expired)."
                npm stage list "electron-debug-mcp" || true
                exit 1
              fi
              echo "stage view failed on attempt $i; retrying"
              sleep 10
              continue
            fi
            cat > /tmp/stage-status.mjs <<'EOF'
let raw = "";
process.stdin.on("data", (d) => {
  raw += d;
});
process.stdin.on("end", () => {
  const start = raw.indexOf("{");
  const end = raw.lastIndexOf("}");
  const fromText = () => {
    const match = raw.match(/status:\s*(\S+)/i);
    console.log(match ? match[1] : "");
  };
  if (start < 0 || end < start) {
    fromText();
    return;
  }
  try {
    const parsed = JSON.parse(raw.slice(start, end + 1));
    console.log(parsed.status || parsed.state || "");
  } catch {
    fromText();
  }
});
EOF
            STATE="$(printf '%s\n' "$OUTPUT" | node /tmp/stage-status.mjs)"
            echo "attempt ${i} status=${STATE}"
            if [[ "$STATE" == "staged" || "$STATE" == "ready" ]]; then
              echo "stage_status=$STATE" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ -n "$STATE" && "$STATE" != "validating" && "$STATE" != "pending" ]]; then
              echo "Stage entered status '$STATE' and cannot be approved."
              exit 1
            fi
            sleep 10
          done
          echo "Stage $STAGE_ID was still validating after 6 minutes."
          npm stage list "electron-debug-mcp" || true
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Approve instructions
        if: success()
        run: |
          echo "::notice title=npm stage ready::Package staged. On your machine (logged into npm as amafjarkasi):"
          echo "  npm stage list"
          if [[ -n "${{ steps.stage.outputs.stage_id }}" ]]; then
            echo "  npm stage approve ${{ steps.stage.outputs.stage_id }} --otp=<authenticator-code>"
          else
            echo "  npm stage approve <stage-id> --otp=<authenticator-code>"
          fi
